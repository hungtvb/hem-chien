name: Import Alpha 1.0 Special Super Frames
on:
  push:
    branches: [feat/alpha10-special-super]
    paths:
      - '.bootstrap/alpha10.txt'
      - '.github/workflows/import-alpha10.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksum-verified Alpha 1.0 source patch
        run: |
          python -m pip install --quiet brotli
          python - <<'PY'
          from pathlib import Path
          import brotli,base64,tarfile,io,hashlib
          archive=brotli.decompress(base64.b64decode(Path('.bootstrap/alpha10.txt').read_text().strip(),validate=True))
          expected='f29d2807daf13dad3efc5ddfda6c8e906fdae2a8f9fb12105653ce19d01ec22e'
          assert hashlib.sha256(archive).hexdigest()==expected, 'source checksum mismatch'
          expected_files={'tools/build_special_frames.py','tools/test_alpha10.py','.github/workflows/alpha10.yml','docs/alpha10-special-super.md'}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as f:
              members=f.getmembers()
              assert {m.name for m in members}==expected_files
              for m in members:
                  assert m.isfile() and m.name in expected_files
                  p=Path(m.name);p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(f.extractfile(m).read())
          print('Restored',len(expected_files),'validated files')
          PY
      - name: Install animation dependencies and Chromium
        run: |
          python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Bake Special and Super frames
        run: |
          python tools/build_special_frames.py
          python tools/build_artist_atlas.py
      - name: Quality gate and gameplay E2E
        run: |
          python -m unittest discover -s tools -p 'test_artist_atlas.py' -v
          python tools/test_alpha10.py
          node --check game.js
      - name: Commit production sources and generated frames
        run: |
          cat >> README.md <<'MD'

          ## Alpha 1.0 — Special / Super cutout animation

          - Special and Super: 4 unique keyframes per pose for Minh and Linh; **24/24** artist overlay poses populated.
          - Color-coded red/orange energy for Minh and blue/cyan for Linh, with gameplay input/damage unchanged.
          - Reproduce with `python tools/build_special_frames.py && python tools/build_artist_atlas.py`.
          - E2E: `python tools/test_alpha10.py`; see `docs/alpha10-special-super.md`.
          - Art status: **concept-derived cutout animation; NOT independently hand-drawn HD**.
          MD
          rm -f alpha10-gameplay-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .bootstrap/alpha10.txt
          git add README.md art-source assets/sprites/artist docs tools
          git commit -m "feat: Alpha 1.0 Special/Super keyframes and 24-of-24 sprite coverage"
          git push origin HEAD:feat/alpha10-special-super
