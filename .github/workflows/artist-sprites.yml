name: Alpha 0.7 Concept Sprite QA and Bake
on:
  pull_request:
    branches: [main]
    paths:
      - 'art-masters/**'
      - 'tools/build_concept_frames.py'
      - 'tools/test_alpha07.py'
      - '.github/workflows/artist-sprites.yml'
  push:
    branches: [main]
    paths:
      - 'art-masters/**'
      - 'tools/build_concept_frames.py'
      - '.github/workflows/artist-sprites.yml'
permissions:
  contents: write
jobs:
  sprite-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sprite and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Render Idle and Walk frames from concept masters
        run: python tools/build_concept_frames.py
      - name: Bake partial artist atlases (do not overwrite fallback atlases)
        run: python tools/build_artist_atlas.py
      - name: Validate frame importer and artwork compatibility
        run: |
          python -m unittest discover -s tools -p 'test_artist_atlas.py' -v
          node --check game.js
      - name: E2E overlay, movement and combat
        run: python tools/test_alpha07.py
      - name: Publish generated sprite prototype assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-source/minh art-source/linh assets/sprites/artist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: bake Alpha 0.7 concept-derived idle and walk frames"
          git push origin HEAD:main
