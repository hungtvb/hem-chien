name: Import Alpha 0.6 artist sprite pipeline
on:
  push:
    branches: ['feat/alpha06-artist-pipeline']
    paths:
      - '.bootstrap/alpha06-payload.b64'
      - '.github/workflows/alpha06-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image/payload libraries
        run: python3 -m pip install --disable-pip-version-check Pillow brotli
      - name: Verify and install source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, brotli, hashlib, io, tarfile, subprocess
          from pathlib import Path
          b64=Path('.bootstrap/alpha06-payload.b64').read_text().strip()
          raw=brotli.decompress(base64.b64decode(b64,validate=True))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='8a1ffe66e9e4bf41c89d940441c5048cb6bc95c6e8fc240e6a084f3fee2f1168',digest
          expected={'game.js.patch','README.md.patch','tools/build_artist_atlas.py',
                    'tools/test_artist_atlas.py','docs/alpha06-artist-import.md',
                    '.github/workflows/artist-sprites.yml',
                    'assets/sprites/artist/manifest.json'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              members=archive.getmembers()
              assert {m.name for m in members}==expected
              assert all(m.isfile() for m in members)
              files={m.name:archive.extractfile(m).read() for m in members}
          patch=files.pop('game.js.patch')+files.pop('README.md.patch')
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,data in files.items():
              dest=Path(name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
          print('Installed Alpha 0.6 source, verified sha256',digest)
          PY
      - name: Validate sprite importer and game
        run: |
          node --check game.js
          python3 tools/build_artist_atlas.py
          python3 -m unittest discover -s tools -p 'test_artist_atlas.py' -v
          git diff --exit-code -- assets/sprites/artist
      - name: Commit tested source to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # This job has contents:write but no workflows:write; only stage source files.
          git add -A -- game.js README.md docs tools assets/sprites/artist
          git commit -m 'feat: Alpha 0.6 artist pose import with safe runtime fallback'
          git push origin HEAD:feat/alpha06-artist-pipeline
