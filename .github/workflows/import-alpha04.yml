name: Import Alpha 0.4 gameplay
on:
  push:
    branches: [feat/alpha04-combat-animation]
    paths:
      - '.github/workflows/import-alpha04.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply checksum-verified patch
        run: |
          python3 -m pip install --disable-pip-version-check --quiet brotli
          python3 - <<'PY'
          import base64,brotli,hashlib
          from pathlib import Path
          content=Path('.bootstrap/alpha04.patch.br.b64').read_text().strip()
          patch=brotli.decompress(base64.b64decode(content,validate=True))
          sha=hashlib.sha256(patch).hexdigest()
          assert sha=='4694035e12925ace6a9ac60608f58ff129cba580c6d2b4746f90fac121586e90', sha
          Path('/tmp/hem-chien-alpha04.patch').write_bytes(patch)
          print('Verified patch',sha,len(patch),'bytes')
          PY
          git apply --check /tmp/hem-chien-alpha04.patch
          git apply /tmp/hem-chien-alpha04.patch
      - name: Syntax validation
        run: |
          node --check game.js
          python3 -m py_compile tools/test_alpha04.py
      - name: Commit alpha 0.4 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -f .bootstrap
          git rm -f .github/workflows/import-alpha04.yml
          git add -A
          git commit -m "feat: animation timelines, hit confirms and training telemetry"
          git push origin HEAD:feat/alpha04-combat-animation
