name: Import Alpha 0.5 Sprite Art
on:
  push:
    branches: [feat/alpha05-ink-cel-sprites]
    paths:
      - '.github/workflows/import-alpha05.yml'
      - '.bootstrap-alpha05/**'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          python -m pip install --quiet brotli Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Unpack checksum-verified source
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,brotli,tarfile,io
          from pathlib import Path
          pieces=sorted(Path('.bootstrap-alpha05').glob('part??'))
          assert len(pieces)==6, len(pieces)
          raw=brotli.decompress(base64.b64decode(''.join(p.read_text().strip() for p in pieces),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='9d965af6b8766c429c4898ecc900c745ee442370336364e0fd0c40ac93cb3830', 'Source SHA mismatch'
          permitted={'game.js','README.md','tools/check_sprite_quality.py','tools/build_sprite_references.py','docs/alpha05-sprite-production.md'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
              members=tf.getmembers()
              assert {m.name for m in members}==permitted
              for member in members:
                  assert member.isfile() and member.name in permitted
                  dest=Path(member.name)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(tf.extractfile(member).read())
          print('Alpha 0.5 source verified and restored')
          PY
      - name: Bake new sprites, references and manifest
        run: |
          node --check game.js
          python tools/export_sprites.py
          python tools/build_sprite_references.py
          python tools/check_sprite_quality.py
      - name: Gameplay regression
        run: python tools/test_alpha04.py
      - name: Commit source and updated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -f .bootstrap-alpha05
          git add game.js README.md tools/check_sprite_quality.py tools/build_sprite_references.py docs/alpha05-sprite-production.md assets/sprites
          git commit -m "feat: Alpha 0.5 ink-cel sprite refinement with 96 validated frames"
          git push origin HEAD:feat/alpha05-ink-cel-sprites
