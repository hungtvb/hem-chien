name: Import Alpha 0.8 Combat Art
on:
  push:
    branches: [feat/alpha08-combat-art]
    paths:
      - '.github/workflows/alpha08-import.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image and browser tooling
        run: |
          python3 -m pip install --quiet brotli Pillow numpy opencv-python-headless playwright
          python3 -m playwright install --with-deps chromium
      - name: Restore source with strict member allowlist
        run: |
          python3 - <<'PY'
          import base64,brotli,io,tarfile
          from pathlib import Path
          raw=brotli.decompress(base64.b64decode(Path('.bootstrap/alpha08-source.br.b64').read_text(),validate=True))
          allow={'tools/build_attack_frames.py','tools/test_alpha08.py','docs/alpha08-combat-sprites.md'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as t:
              members=t.getmembers()
              assert {x.name for x in members}==allow
              for member in members:
                  assert member.isfile() and member.name in allow
                  dst=Path(member.name)
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(t.extractfile(member).read())
          readme=Path('README.md')
          content=readme.read_text()
          if '## Alpha 0.8 — Combat sprites' not in content:
              readme.write_text(content+'\n## Alpha 0.8 — Combat sprites\n\nBổ sung 32 frame LP/HP/LK/HK bằng biến dạng cutout từ master Alpha 0.7; mỗi nhân vật có 6/12 pose overlay (idle, walk, lp, hp, lk, hk). Build lại với `python tools/build_attack_frames.py` và `python tools/build_artist_atlas.py`. Chi tiết và giới hạn artwork: [docs/alpha08-combat-sprites.md](docs/alpha08-combat-sprites.md). Đây chưa phải frame hand-drawn riêng lẻ.\n')
          PY
      - name: Generate combat frames and artist overlay
        run: |
          python3 tools/build_attack_frames.py
          python3 tools/build_artist_atlas.py
      - name: Run sprite/import and combat E2E checks
        run: |
          node --check game.js
          python3 -m unittest discover -s tools -p test_artist_atlas.py -v
          python3 tools/test_alpha08.py
          python3 tools/check_sprite_quality.py
      - name: Commit tested game assets and cleanup bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f alpha08-gameplay-preview.png
          git rm -f .bootstrap/alpha08-source.br.b64 .github/workflows/alpha08-import.yml
          git add README.md docs/alpha08-combat-sprites.md tools/build_attack_frames.py tools/test_alpha08.py art-source assets/sprites/artist
          git commit -m "feat: Alpha 0.8 cutout attack frames and verified artist overlays"
          git push origin HEAD:feat/alpha08-combat-art
