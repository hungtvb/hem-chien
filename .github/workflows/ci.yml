name: Validate Hẻm Chiến
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check source files
        run: |
          test -s index.html
          test -s styles.css
          test -s game.js
          test -s assets/saigon-night.png
      - name: JavaScript syntax
        run: node --check game.js
      - name: Python syntax
        run: python3 -m py_compile tools/generate_stage.py tools/test_browser.py
